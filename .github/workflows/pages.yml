name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare presentaciones PDF
        run: |
          mkdir -p Pagina/assets/presentaciones
          cp "Clase 1/Vision por computador presentacion.pdf" Pagina/assets/presentaciones/clase-1-presentacion.pdf
          cp "Clase 11/Clase 11 - Presentacion.pdf" Pagina/assets/presentaciones/clase-11-presentacion.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Pagina'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4